<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secman — Регистрация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }
        .register-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .register-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .register-logo h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .register-logo p { color: #888; margin-top: 8px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #aaa; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; background: rgba(255,255,255,0.07); color: #e0e0e0;
            font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none; border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }
        .form-group input::placeholder { color: #666; }
        .btn-register {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2); color: white;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
        }
        .btn-register:hover { opacity: 0.9; }
        .btn-register:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg, .success-msg {
            padding: 12px 16px; border-radius: 8px; margin-bottom: 20px;
            font-size: 0.9rem; display: none;
        }
        .error-msg {
            background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
        }
        .success-msg {
            background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3);
            color: #86efac;
        }
        .error-msg.visible, .success-msg.visible { display: block; }
        .login-link {
            text-align: center; margin-top: 24px; color: #888; font-size: 0.9rem;
        }
        .login-link a { color: #667eea; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .register-container { margin: 16px; padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-logo">
            <h1>🔐 Secman</h1>
            <p>Создать аккаунт</p>
        </div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" required minlength="3" maxlength="255" placeholder="mike">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Подтверждение пароля</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-register" id="btnRegister">Зарегистрироваться</button>
        </form>
        <div class="login-link">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>
    </div>
    <script>
        const form = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const btnRegister = document.getElementById('btnRegister');

        if (localStorage.getItem('secman_token')) {
            window.location.href = '/dashboard';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('visible');
            successMsg.classList.remove('visible');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                errorMsg.textContent = 'Пароли не совпадают';
                errorMsg.classList.add('visible');
                return;
            }

            btnRegister.disabled = true;
            btnRegister.textContent = 'Регистрация...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    successMsg.textContent = 'Регистрация успешна! Перенаправление...';
                    successMsg.classList.add('visible');
                    setTimeout(() => { window.location.href = '/login'; }, 1500);
                } else {
                    errorMsg.textContent = data.error || 'Ошибка регистрации';
                    errorMsg.classList.add('visible');
                }
            } catch (err) {
                errorMsg.textContent = 'Не удалось подключиться к серверу';
                errorMsg.classList.add('visible');
            } finally {
                btnRegister.disabled = false;
                btnRegister.textContent = 'Зарегистрироваться';
            }
        });
    </script>
</body>
</html>
