services:
  secman:
    build:
      context: ./secman
      dockerfile: Dockerfile
    container_name: secman
    ports:
      - "9090:9090"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SECMAN_JWT_SECRET=${SECMAN_JWT_SECRET:-jwt-secret-change-in-prod}
      - SECMAN_DEFAULT_USER=${SECMAN_DEFAULT_USER:-admin}
      - SECMAN_DEFAULT_PASSWORD=${SECMAN_DEFAULT_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - secman-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: secman-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - secman-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - secman-net
    restart: unless-stopped

volumes:
  secman-db-data:
    driver: local

networks:
  secman-net:
    driver: bridge
