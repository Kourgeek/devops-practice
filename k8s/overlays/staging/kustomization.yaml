apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-management-staging
namePrefix: staging-
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: task-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
  - target:
      kind: Deployment
      name: notification-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "192Mi"
  - target:
      kind: Deployment
      name: web-ui
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "192Mi"
  - target:
      kind: Deployment
      name: db
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/size
        value: "10Gi"
configMapGenerator:
  - name: task-management-config
    behavior: merge
    literals:
      - HEALTH_CHECK_INTERVAL=30
      - PROCESSING_TIMEOUT=30
      - DB_USER=devops
      - DB_NAME=taskdb
      - POSTGRES_USER=devops
      - POSTGRES_DB=taskdb
      - TASK_SERVICE_URL=http://task-service.task-management-staging.svc.cluster.local:8000
      - NOTIFICATION_SERVICE_URL=http://notification-service.task-management-staging.svc.cluster.local:9000
      - LOG_LEVEL=info
      - ENABLE_PROFILING=false
      - ENABLE_DEBUG_ENDPOINTS=false
