# Environment: PRODUCTION
environment: prod

namespace:
  name: task-management-prod

images:
  taskService:
    tag: "1.1.0"
  notificationService:
    tag: "1.1.0"
  webUI:
    tag: "1.1.0"

replicaCount:
  taskService: 3
  notificationService: 3
  webUI: 3
  db: 1

resources:
  taskService:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  notificationService:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "384Mi"
  webUI:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "384Mi"
  db:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

healthCheck:
  interval: 15
  processingTimeout: 15

ingress:
  enabled: true
  host: task-management.example.com
  tls:
    enabled: true
    secretName: task-management-prod-tls
    hosts:
      - task-management.example.com

database:
  pvcSize: 20Gi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  cpuUtilization: 70
  memoryUtilization: 80

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
