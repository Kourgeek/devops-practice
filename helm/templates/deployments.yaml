# task-service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-management.task-service" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: task-service
    component: task-service
    release: {{ .Release.Name }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount.taskService }}
  {{- end }}
  selector:
    matchLabels:
      app: task-service
      component: task-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: task-service
        component: task-service
        release: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.services.taskService.port }}"
    spec:
      containers:
        - name: task-service
          image: "{{ .Values.images.taskService.repository }}:{{ .Values.images.taskService.tag }}"
          imagePullPolicy: {{ .Values.images.taskService.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.taskService.port }}
              name: http
              protocol: TCP
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-management.fullname" . }}-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-management.fullname" . }}-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-management.fullname" . }}-secret
                  key: DB_NAME
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@{{ include "task-management.db" . }}:{{ .Values.services.db.port }}/$(DB_NAME)"
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-management.fullname" . }}-config
                  key: NOTIFICATION_SERVICE_URL
            - name: HEALTH_CHECK_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-management.fullname" . }}-config
                  key: HEALTH_CHECK_INTERVAL
            - name: PROCESSING_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-management.fullname" . }}-config
                  key: PROCESSING_TIMEOUT
          resources:
            requests:
              cpu: {{ .Values.resources.taskService.requests.cpu }}
              memory: {{ .Values.resources.taskService.requests.memory }}
            limits:
              cpu: {{ .Values.resources.taskService.limits.cpu }}
              memory: {{ .Values.resources.taskService.limits.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.taskService.port }}
            initialDelaySeconds: 15
            periodSeconds: {{ .Values.healthCheck.interval }}
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.taskService.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.taskService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
---
# task-service Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-management.task-service" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: task-service
    component: task-service
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.services.taskService.type }}
  selector:
    app: task-service
    component: task-service
  ports:
    - port: {{ .Values.services.taskService.port }}
      targetPort: {{ .Values.services.taskService.port }}
      protocol: TCP
      name: http
---
