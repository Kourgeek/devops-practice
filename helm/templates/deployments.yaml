{{- if .Values.database.enabled }}
# DB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-management.db" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
    component: db
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount.db }}
  selector:
    matchLabels:
      app: postgres
      component: db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
        component: db
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.db.port }}
              name: postgres
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-management.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-management.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-management.fullname" . }}-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: {{ .Values.resources.db.requests.cpu }}
              memory: {{ .Values.resources.db.requests.memory }}
            limits:
              cpu: {{ .Values.resources.db.limits.cpu }}
              memory: {{ .Values.resources.db.limits.memory }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - devops
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - devops
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "task-management.fullname" . }}-postgres-pvc
---
# DB Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-management.db" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
    component: db
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.services.db.type }}
  selector:
    app: postgres
    component: db
  ports:
    - port: {{ .Values.services.db.port }}
      targetPort: {{ .Values.services.db.port }}
      protocol: TCP
      name: postgres
{{- end }}
---
{{- if .Values.ingress.enabled }}
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "task-management.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "task-management.web-ui" . }}
                port:
                  number: {{ .Values.services.webUI.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.tls.hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
---
{{- if .Values.hpa.enabled }}
# HPA for task-service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "task-management.task-service" . }}-hpa
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "task-management.task-service" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.cpuUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.memoryUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
---
# HPA for web-ui
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "task-management.web-ui" . }}-hpa
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "task-management.web-ui" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.cpuUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.memoryUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
{{- end }}
---
{{- if .Values.pdb.enabled }}
# PDB for task-service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "task-management.task-service" . }}-pdb
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: task-service
      component: task-service
---
# PDB for web-ui
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "task-management.web-ui" . }}-pdb
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: web-ui
      component: web-ui
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-management.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.services.webUI.port }}
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
